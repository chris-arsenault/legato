services:
  legato-server:
    image: ghcr.io/chris-arsenault/legato:${IMAGE_TAG}
    container_name: legato-server
    restart: unless-stopped
    user: "${LEGATO_UID:-42173}:${LEGATO_GID:-42173}"
    environment:
      LEGATO_SERVER__COMMON__TRACING__JSON: "true"
      LEGATO_SERVER__COMMON__TRACING__LEVEL: "info"
      LEGATO_SERVER__COMMON__TRACING__LOG_DIR: "/var/lib/legato/logs"
      LEGATO_SERVER__COMMON__METRICS__BIND_ADDRESS: "0.0.0.0:9464"
      LEGATO_SERVER__COMMON__METRICS__PREFIX: "legato_server"
      LEGATO_SERVER__SERVER__BOOTSTRAP__ADVERTISED_ENDPOINT: "192.168.66.3:7823"
      LEGATO_SERVER__SERVER__BOOTSTRAP__ADVERTISED_BOOTSTRAP_URL: "http://192.168.66.3:7824"
      LEGATO_SERVER__SERVER__BOOTSTRAP__SERVER_NAME: "192.168.66.3"
    ports:
      - "192.168.66.3:7823:7823"
      - "192.168.66.3:7824:7824"
      - "192.168.66.3:7825:7825/udp"
      - "192.168.66.3:9464:9464"
    volumes:
      - /mnt/apps/shares/legato:/srv/libraries:ro
      - /mnt/apps/apps/legato:/var/lib/legato
      - /mnt/apps/apps/legato/config:/etc/legato
